<!doctype html><html lang="en"><head><meta charset="utf-8">
<!-- MYXOBRAIN X videos, 1920 x 1080. ?s=<scene>; _tools/render.mjs steps a virtual clock and calls window.seek(t) at 30 fps,
     so the site's own 3D ring (ring.js) and every text animation render frame-exact.
     Scenes: caintro caoutro paydex burn morph explainer papers specimen-<physarum|worm|fry|ant|bee|ecoli> -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#070707;--fg:#EDEDE7;--mute:#9A9A92;--faint:#6A6A62;--line:rgba(237,237,231,.14);--acc:#FFB000;--up:#5BD68A;--dn:#FF7A66;--mono:"JetBrains Mono",monospace;--sans:Inter,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:var(--bg);color:var(--fg);font-family:var(--sans);-webkit-font-smoothing:antialiased}
#stage{position:relative;width:1920px;height:1080px;overflow:hidden;background:radial-gradient(ellipse at 70% 55%,#151309 0,#070707 60%)}
.abs{position:absolute}
.bgimg{position:absolute;inset:0;background:center/cover no-repeat;will-change:transform,opacity}
.right{left:720px;-webkit-mask-image:linear-gradient(90deg,transparent,#000 30%);mask-image:linear-gradient(90deg,transparent,#000 30%)}
canvas.ring{position:absolute;left:700px;top:40px;width:1220px;height:1000px}
.brand{display:flex;align-items:center;gap:18px;font:500 26px/1 var(--mono);letter-spacing:.3em}
.brand img{width:44px;height:44px}
.kick{font:500 22px var(--mono);letter-spacing:.24em;color:var(--acc)}
.big{font:500 124px/1 var(--sans);letter-spacing:-.04em}
.big em,.mid em{font-style:normal;color:var(--acc)}
.mid{font:400 80px/1.05 var(--sans);letter-spacing:-.03em}
.small{font:300 32px/1.45 var(--sans);color:#C4C4BC}
.mono{font:400 24px var(--mono);color:var(--mute)}
.term{width:900px;border:1px solid var(--line);background:rgba(10,10,8,.92)}
.term .tb{display:flex;gap:9px;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
.term .tb i{width:11px;height:11px;border-radius:50%;background:#3a3a34}.term .tb span{margin-left:auto;font:15px var(--mono);color:var(--mute)}
.term pre{padding:24px 26px;min-height:190px;font:400 25px/1.75 var(--mono);color:#DEDED8;white-space:pre}
.p,.k{color:var(--acc)}.g{color:var(--up)}.r{color:var(--dn)}.c{color:#fff}.o{color:var(--mute)}
.bar{height:14px;background:rgba(237,237,231,.12);overflow:hidden}.bar i{display:block;height:100%;background:var(--acc);transform-origin:left}
.foot{left:100px;right:100px;bottom:62px;display:flex;justify-content:space-between;font:400 20px var(--mono);color:var(--mute);text-shadow:0 0 8px #070707,0 0 20px #070707}
.card{position:absolute;inset:0;background:center/contain no-repeat;will-change:transform,opacity}
</style></head><body><div id="stage"></div>
<script type="module">
import { createRing } from "/ring.js";
const $s = document.getElementById("stage"), Q = new URLSearchParams(location.search), TICKER = Q.get("ticker") || "$MYXO";
const clamp = (x) => Math.max(0, Math.min(1, x)), ease = (x) => { x = clamp(x); return x * x * (3 - 2 * x); };
const io = (t, a, b) => ease((t - a) / (b - a)), win = (t, a, b, f = 0.5) => Math.min(io(t, a, a + f), 1 - io(t, b - f, b));
const el = (html, css = "") => { const d = document.createElement("div"); d.className = "abs"; d.style.cssText = css; d.innerHTML = html; $s.append(d); return d; };
const show = (d, o, dy = 0, s = 1) => { d.style.opacity = o; d.style.transform = `translateY(${(1 - o) * dy}px) scale(${s})`; };
const typed = (s, k) => s.slice(0, Math.max(0, Math.floor(k)));
const col = (s) => s.replace(/<(\w)>(.*?)<\/\1>/g, '<span class="$1">$2</span>');
const brand = (css = "left:100px;top:96px") => el(`<div class="brand"><img src="/brand/logo.png" alt="">MYXOBRAIN</div>`, css);
const foot = () => el(`<span style="color:var(--fg)">myxobrain.com</span><span>paper trading · not financial advice · not affiliated with Robinhood</span>`).classList.add("foot");
const fmt = (n) => "$" + (n >= 1000 ? (n / 1000).toFixed(n < 10000 ? 1 : 0) + "K" : Math.round(n));
const exists = (u) => fetch(u, { method: "HEAD" }).then((r) => r.ok, () => false);
const ALT = { vault: "jars", dawn: "city", ember: "slime" };   // stand-ins until Hugging Face quota allows the real still
async function photo(name, cls = "") { let u = `/kit/_hf/${name}.webp`; if (!(await exists(u)) && ALT[name]) u = `/kit/_hf/${ALT[name]}.webp`; if (!(await exists(u))) return null; const d = el(""); d.className = "bgimg " + cls; d.style.backgroundImage = `url(${u})`; await new Promise((r) => { const i = new Image(); i.onload = i.onerror = r; i.src = u; }); return d; }
let DATA;
async function ring(css) {
  DATA ||= await Promise.all([fetch("/data/connectome-ring.json").then((r) => r.json()), fetch("/data/league-EXP-004.json").then((r) => r.json())]);
  const [C, L] = DATA, c = document.createElement("canvas"); c.className = "ring"; if (css) c.style.cssText = css; $s.append(c);
  const R = createRing(c, C, { labels: true, scale: 0.3 });
  const at = (org, k = 0.62) => { const F = L.organisms[org]?.frames || [], f = F[Math.floor((F.length - 1) * k)]; R.show(org, { syms: L.syms, w: f?.w || [], inner: f?.inner, label: (i) => (f && f.w[i] > 0.01 ? `${L.syms[i]} ${(f.w[i] * 100).toFixed(0)}%` : L.syms[i]) }); };
  return { c, at };
}
const SPEC = {
  physarum: ["01", "Physarum", "Physarum polycephalum", "0 neurons", "A single cell that solved a maze and redrew Tokyo's rail network.", "Tubes that carry flow thicken. Idle tubes fade.", "Tero, Kobayashi & Nakagaki · 2007", "slime"],
  worm: ["02", "Worm", "Caenorhabditis elegans", "302 neurons", "The first animal whose whole nervous system was mapped.", "Smell runs through the real wiring to a turn or a run.", "Cook et al. · Nature · 2019", "worm"],
  fry: ["03", "Fry", "Danio rerio, larva", "11 model cells", "A transparent larva whose whole brain can be imaged at once.", "A cell that fires hard enough buys. A silent cell sells.", "Hebb · 1949 · Chen et al. · 2013", "fry"],
  ant: ["04", "Ants", "Formicidae colony", "no leader", "A colony that finds the shorter bridge with pheromone alone.", "Trails to profit get pheromone. Unused trails evaporate.", "Dorigo & Gambardella · 1997", "ants"],
  bee: ["05", "Bees", "Apis mellifera swarm", "quorum", "A swarm that picks a new home by dancing, with no leader.", "Scouts dance for assets. At a quorum, the swarm moves.", "Seeley & Buhrman · 1999", "swarm"],
  ecoli: ["06", "E. coli", "Escherichia coli", "1 cell, no neurons", "A bacterium that compares now with a moment ago.", "Keep swimming while food improves. Tumble when it drops.", "Berg & Brown · Nature · 1972", "bacteria"],
};
const ORDER = ["worm", "physarum", "fry", "ant", "bee", "ecoli"];

const SCENES = {
  // ---------------- the CA post: intro and end card around the screen recording ----------------
  caintro: { dur: 5, async build() {
      const bg = await photo("petri", "right"); const b = brand();
      const k = el(`<div class="kick">LIVE ON ROBINHOOD CHAIN</div>`, "left:100px;top:380px");
      const h = el(`<div class="big">${TICKER}<br><em>is live.</em></div>`, "left:96px;top:440px");
      const s = el(`<div class="small">Six models of real organisms<br>read the market as food.</div>`, "left:100px;top:730px"); foot();
      return (t) => { if (bg) { bg.style.opacity = io(t, 0, 1.2) * .95; bg.style.transform = `scale(${1.08 - .06 * io(t, 0, 5)})`; }
        show(b, io(t, .2, .9)); show(k, io(t, .5, 1.1), 20); show(h, io(t, .7, 1.5), 30); show(s, io(t, 1.3, 2.1), 20); };
    } },
  caoutro: { dur: 5, async build() {
      const m = el(`<img src="/brand/logo.png" style="width:150px;height:150px;display:block">`, "left:885px;top:230px");
      const h = el(`<div class="mid" style="text-align:center">Six minds.<br><em>One market.</em></div>`, "left:0;right:0;top:440px");
      const u = el(`<div class="mono" style="text-align:center;color:var(--fg);font-size:30px">myxobrain.com · npx myxobrain-agent</div>`, "left:0;right:0;top:680px");
      const c = el(`<div class="mono" style="text-align:center">contract address in the post</div>`, "left:0;right:0;top:740px");
      return (t) => { show(m, io(t, .1, .8), 0, .9 + .1 * io(t, .1, 1)); show(h, io(t, .5, 1.3), 30); show(u, io(t, 1.2, 1.8), 15); show(c, io(t, 1.5, 2.1), 15); };
    } },

  // ---------------- milestone: $20K market cap and the DEX Screener profile ----------------
  paydex: { dur: 12, async build() {
      const bg = await photo("city"); const veil = el("", "inset:0;background:rgba(7,7,7,.66)"); const b = brand();
      const k = el(`<div class="kick">MILESTONE · MARKET CAP</div>`, "left:100px;top:300px");
      const num = el(`<div class="big" style="font-size:230px">$0</div>`, "left:92px;top:350px");
      const bar = el(`<div class="bar" style="width:1100px"><i style="transform:scaleX(0)"></i></div>`, "left:100px;top:640px");
      const lab = el(`<div class="mono">$0</div><div class="mono" style="position:absolute;left:1030px;top:0">$20K</div>`, "left:100px;top:672px;width:1100px");
      const d1 = el(`<div class="mid">DEX Screener profile:<br><em>paid.</em></div>`, "left:100px;top:780px");
      const end = el(`<div class="mid" style="text-align:center">Thank you for<br><em>the first 20K.</em></div><div class="small" style="text-align:center;margin-top:34px">The lab keeps running. Six minds, every number public.</div>`, "left:0;right:0;top:330px");
      foot();
      return (t) => {
        if (bg) bg.style.transform = `scale(${1.12 - .08 * io(t, 0, 12)})`;
        const a = win(t, 0, 8.4, .6); show(b, io(t, .2, .8)); show(k, a); show(bar, a); show(lab, a);
        const v = 20000 * ease((t - 1) / 4.2); num.firstChild.textContent = fmt(v); show(num, a, 30); num.firstChild.style.color = t > 5.2 ? "var(--acc)" : "";
        bar.querySelector("i").style.transform = `scaleX(${v / 20000})`; show(d1, Math.min(io(t, 5.6, 6.3), a), 20); show(end, io(t, 8.8, 9.8), 30);
      };
    } },

  // ---------------- the dev wallet burns its whole supply ----------------
  burn: { dur: 14, async build() {
      const bg = await photo("ember", "right"); const fire = el("", "inset:0"); const b = brand();
      const k = el(`<div class="kick">DEV SUPPLY · ONCHAIN</div>`, "left:100px;top:270px");
      const h = el(`<div class="mid">Dev wallet</div>`, "left:100px;top:320px");
      const n = el(`<div class="big" style="font-size:150px">100%</div>`, "left:92px;top:420px");
      const bar = el(`<div class="bar" style="width:900px"><i></i></div>`, "left:100px;top:610px");
      const to = el(`<div class="mono" style="color:var(--fg)">→ sent to 0x…dEaD, the dead address</div>`, "left:100px;top:660px");
      const done = el(`<div class="big">Burned.<br><em>All of it.</em></div><div class="small" style="margin-top:36px">The dev wallet holds zero ${TICKER}.<br>The tx is in the post. Check it yourself.</div>`, "left:100px;top:300px");
      foot();
      return (t) => {
        if (bg) { bg.style.opacity = .35 + .65 * io(t, 2.5, 7); bg.style.transform = `scale(${1.04 + .06 * io(t, 0, 14)})`; }
        const g = io(t, 3, 7); fire.style.background = `radial-gradient(circle at 75% 40%, rgba(255,176,0,${.28 * g * (1 - io(t, 9, 12))}), rgba(7,7,7,0) 55%)`;
        const a = win(t, .4, 8.8, .6); show(b, io(t, .2, .8)); show(k, a); show(h, a, 20); show(bar, a); show(to, Math.min(a, io(t, 2.4, 3)), 10);
        const left = 1 - ease((t - 3) / 4.5); n.firstChild.textContent = Math.round(left * 100) + "%"; show(n, a, 30);
        n.firstChild.style.color = left < .005 ? "var(--acc)" : ""; bar.querySelector("i").style.transform = `scaleX(${left})`; show(done, io(t, 9.2, 10.2), 30);
      };
    } },

  // ---------------- the 3D specimen morphing through all six ----------------
  morph: { dur: 26, async build() {
      const R = await ring(); const b = brand();
      const rows = ORDER.map((k) => { const [no, name, latin, brain, fact, rule, cite] = SPEC[k];
        return el(`<div class="kick">SPECIMEN ${no} · ${brain.toUpperCase()}</div><div class="mid" style="margin-top:18px">${name}.</div><div class="mono" style="margin-top:12px;font-style:italic">${latin}</div><div class="small" style="margin-top:26px;width:620px">${rule}</div><div class="mono" style="margin-top:26px;font-size:19px">${cite}</div>`, "left:100px;top:330px"); });
      const cnt = el(`<div class="mono" style="color:var(--fg)"><span id="c">01</span> &nbsp;—————&nbsp; 06</div>`, "left:100px;top:860px"); foot();
      const SEG = 4, shown = new Set();
      return (t) => { const k = Math.min(Math.floor(t / SEG), 5), r = t - k * SEG;
        if (!shown.has(k)) { shown.add(k); R.at(ORDER[k]); }
        rows.forEach((d, i) => show(d, i === k ? win(r, 0, SEG + (k === 5 ? 9 : 0), .45) : 0, 18));
        document.getElementById("c").textContent = String(k + 1).padStart(2, "0"); show(b, io(t, 0, .6)); R.c.style.opacity = io(t, 0, .8); };
    } },

  // ---------------- explainer: food, six minds, four gates, verify ----------------
  explainer: { dur: 26, async build() {
      const bgs = []; for (const n of ["scope", "jars", "comb", "vault"]) bgs.push(await photo(n, "right"));
      const b = brand();
      const term = el(`<div class="term"><div class="tb"><i></i><i></i><i></i><span>myxo · real output</span></div><pre></pre></div>`, "left:100px;top:560px"); const pre = term.querySelector("pre");
      const S = [
        ["01 · THE FOOD", "The market<br><em>becomes food.</em>", "myxo league 4", ["<k>EXP-004</k> · mean reversion as food", "11 assets · 0.3% cost · 5 seeds"]],
        ["02 · SIX MINDS", "Six organisms.<br><em>No AI.</em>", "myxo minds", ["PHYSARUM · WORM · FRY · ANT · BEE · E. COLI", "<g>20</g> papers behind them"]],
        ["03 · FOUR GATES", "All four,<br><em>or it failed.</em>", "myxo gates 4", ["FRY  <g>PASS</g> <g>PASS</g> <g>PASS</g> <r>FAIL</r>  3/4", "closest so far · holdout still sealed"]],
        ["04 · VERIFY", "Don't trust.<br><em>Recompute.</em>", "myxo verify", ["<g>✓</g> 17/17 files match the manifest", "engine + raw data, SHA-256"]],
      ];
      const heads = S.map(([k, h]) => el(`<div class="kick">${k}</div><div class="mid" style="margin-top:20px">${h}</div>`, "left:100px;top:250px"));
      const end = el(`<div class="mid" style="text-align:center">Six minds.<br><em>Every number public.</em></div><div class="mono" style="text-align:center;margin-top:40px;color:var(--fg);font-size:30px">myxobrain.com</div>`, "left:0;right:0;top:380px");
      foot(); const D = 5.6;
      return (t) => { show(b, io(t, 0, .6));
        const k = Math.min(Math.floor(t / D), 3), r = t - k * D, tail = t > 4 * D;
        bgs.forEach((g, i) => { if (!g) return; g.style.opacity = tail ? 0 : (i === k ? win(r, 0, D, .5) * .9 : 0); g.style.transform = `scale(${1.1 - .06 * clamp(r / D)})`; });
        heads.forEach((h, i) => show(h, !tail && i === k ? win(r, 0, D, .45) : 0, 24));
        const [, , cmd, outs] = S[k], n = (r - .7) / .045;
        let o = `<span class="p">$ </span><span class="c">${typed(cmd, n)}</span>`;
        outs.forEach((x, j) => { if (r > .7 + cmd.length * .045 + .35 + j * .25) o += "\n" + col(x); });
        pre.innerHTML = o + (Math.floor(t * 2) % 2 ? "" : '<span style="display:inline-block;width:.6em;height:1.05em;vertical-align:-.2em;background:var(--fg)"></span>');
        show(term, tail ? 1 - io(t, 4 * D, 4 * D + .5) : io(t, .3, .9), 20); show(end, io(t, 4 * D + .4, 4 * D + 1.3), 30); };
    } },

  // ---------------- the MYXO PAPER cards, one after another ----------------
  papers: { dur: 30, async build() {
      const ids = ["02-the-blob", "04-tokyo", "07-the-map", "08-the-count", "12-glass-fish", "14-fire-together", "17-the-bridge", "24-the-quorum", "27-run-and-tumble", "32-the-question"];
      const cards = []; for (const id of ids) { const u = `/kit/research/${id}.png`; if (await exists(u)) { const d = el(""); d.className = "card"; d.style.backgroundImage = `url(${u})`; await new Promise((r) => { const i = new Image(); i.onload = i.onerror = r; i.src = u; }); cards.push(d); } }
      const D = 30 / Math.max(1, cards.length);
      return (t) => cards.forEach((c, i) => { const r = t - i * D; c.style.opacity = r < -0.4 || r > D + .4 ? 0 : win(r, -.4, D + .4, .6); c.style.transform = `scale(${1.04 - .04 * clamp(r / D)})`; });
    } },
};
// one specimen per video: the photo, its paper, and the 3D ring morphing from the worm into it
for (const k of ORDER) SCENES[`specimen-${k}`] = { dur: 14, async build() {
  const [no, name, latin, brain, fact, rule, cite, still] = SPEC[k];
  const bg = await photo(still); const veil = el("", "inset:0;background:linear-gradient(90deg,rgba(7,7,7,.92) 30%,rgba(7,7,7,.35))");
  const R = await ring("left:760px;top:40px;width:1160px;height:1000px"); const b = brand();
  const a = el(`<div class="kick">MYXO SPECIMEN ${no} · ${brain.toUpperCase()}</div><div class="big" style="margin-top:24px;font-size:116px">${name}.</div><div class="mono" style="margin-top:14px;font-style:italic;font-size:26px">${latin}</div>`, "left:100px;top:250px");
  const f = el(`<div class="small" style="width:660px">${fact}</div>`, "left:100px;top:560px");
  const m = el(`<div class="kick" style="font-size:18px">IN MYXOBRAIN</div><div class="small" style="width:660px;margin-top:14px;color:var(--fg)">${rule}</div>`, "left:100px;top:700px");
  const c = el(`<div class="mono" style="font-size:20px">${cite}</div>`, "left:100px;top:880px"); foot();
  let morphed = false; R.at("worm");
  return (t) => { if (!morphed && t > 3.2 && k !== "worm") { morphed = true; R.at(k); }
    if (bg) { bg.style.opacity = .55 * (1 - io(t, 2.6, 4.5)) + .2; bg.style.transform = `scale(${1.1 - .08 * io(t, 0, 14)})`; }
    show(b, io(t, 0, .6)); show(a, io(t, .4, 1.2), 30); show(f, io(t, 1.4, 2.2), 20); show(m, io(t, 4, 4.8), 20); show(c, io(t, 5, 5.6), 10); R.c.style.opacity = io(t, .2, 1.4); };
} };

const name = Q.get("s") || "caintro", S = SCENES[name];
window.DUR = S.dur; const draw = await S.build(); await document.fonts.ready;
window.seek = (t) => draw(t); draw(0); window.READY = true;
</script></body></html>
